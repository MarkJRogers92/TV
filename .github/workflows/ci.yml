name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref, so a burst of pushes to a PR branch
# doesn't queue up redundant jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# These checks only read the repository.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Matches local development; vite@7 requires >=22.12.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
